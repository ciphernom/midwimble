# Builds a release binary of midwimble — one binary carrying the node, wallet,
# pool, merged miner and anchoring subcommands — with the webrtc and gpu
# features, and publishes it as a GitHub release.
#
#   --release --features webrtc,gpu
#     webrtc  enables the `node` feature the binary requires, and browser
#             wallets over /webrtc-direct
#     gpu     adds midstate's wgpu miner
#
# Trigger it two ways:
#   * Manually: Actions -> Release -> Run workflow, giving a name (the first
#     candidate is "safeword") and whether it is a pre-release (default yes).
#   * By tag:   push a tag (safeword, or v* / rc-*) and the release takes the
#     tag's name.
#
# One-time setup: nothing — GITHUB_TOKEN already has the `contents: write`
# permission requested below, which is enough to create the tag, the release
# and upload the binary.
name: Release

on:
  workflow_dispatch:
    inputs:
      name:
        description: Release name / tag (the first candidate is "safeword")
        type: string
        default: safeword
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true
  push:
    tags:
      - safeword
      - 'v*'
      - 'rc-*'

permissions:
  contents: write # create the tag and release, and upload the binary

# One release per name; a run already going finishes before another starts.
concurrency:
  group: release-${{ github.event.inputs.name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: webrtc-gpu

      # ubuntu-latest already carries the C toolchain, cmake and perl the
      # dependencies need (ring, wgpu/ash); wgpu loads Vulkan at runtime, so no
      # GPU libraries are needed to build. Nothing extra to install.
      - name: Build
        run: cargo build --release --locked --features webrtc,gpu --bin midwimble

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.name || github.ref_name }}"
          TARGET=x86_64-unknown-linux-gnu
          STEM="midwimble-${TAG}-${TARGET}"
          mkdir -p "dist/${STEM}"
          cp target/release/midwimble "dist/${STEM}/"
          cp LICENSE README.md "dist/${STEM}/"
          tar -C dist -czf "dist/${STEM}.tar.gz" "${STEM}"
          sha256sum "dist/${STEM}.tar.gz" | tee "dist/${STEM}.tar.gz.sha256"
          {
            echo "tag=${TAG}"
            echo "tarball=dist/${STEM}.tar.gz"
            echo "sha256file=dist/${STEM}.tar.gz.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          TARBALL: ${{ steps.pkg.outputs.tarball }}
          SHA256FILE: ${{ steps.pkg.outputs.sha256file }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || 'true' }}
        run: |
          set -euo pipefail
          sum="$(cut -d' ' -f1 "$SHA256FILE")"
          {
            echo "Release candidate **$TAG** of midwimble."
            echo
            echo "- Built \`--release --features webrtc,gpu\` from commit \`$GITHUB_SHA\`"
            echo "- Target: \`x86_64-unknown-linux-gnu\`"
            echo "- One \`midwimble\` binary: node, wallet, pool, merged miner, anchoring"
            echo "- Tarball SHA-256: \`$sum\`"
          } > notes.md
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" "$SHA256FILE" --clobber
          else
            gh release create "$TAG" "$TARBALL" "$SHA256FILE" \
              --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" $flag
          fi
