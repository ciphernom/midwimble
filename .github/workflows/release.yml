# Builds release binaries of midwimble — one binary carrying the node, wallet,
# pool, merged miner and anchoring subcommands — for every supported platform,
# with the webrtc and gpu features, and publishes them as one GitHub release.
#
#   --release --features webrtc,gpu
#     webrtc  enables the `node` feature the binary requires, and browser
#             wallets over /webrtc-direct
#     gpu     adds midstate's wgpu miner
#
# Every target builds natively on its own runner, so there is no
# cross-compilation: `ring` (the rustls provider; no aws-lc, no nasm) and wgpu
# both compile from the committed Cargo.lock with no extra system packages.
#
# Trigger it two ways:
#   * Manually: Actions -> Release -> Run workflow, giving a name (the first
#     candidate is "safeword") and whether it is a pre-release (default yes).
#   * By tag:   push a tag (safeword, or v* / rc-*) and the release takes the
#     tag's name.
#
# One-time setup: nothing — GITHUB_TOKEN already has the `contents: write`
# permission requested below, enough to create the tag, the release and upload
# the binaries. Native ARM and Windows-on-ARM runners are free for public
# repositories.
name: Release

on:
  workflow_dispatch:
    inputs:
      name:
        description: Version / tag (the first candidate is v1.0-SAFEWORD-RC)
        type: string
        default: v1.0-SAFEWORD-RC
      prerelease:
        description: Pre-release? "auto" marks it one when the version contains RC
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
        default: auto
  push:
    tags:
      # Versioned tags, e.g. v1.0-SAFEWORD-RC, v1.0, v1.1-RC.
      - 'v*'

permissions:
  contents: write # create the tag and release, and upload the binaries

# One release per name; a run already going finishes before another starts.
concurrency:
  group: release-${{ github.event.inputs.name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing (a runner image change, say) must not throw away
      # the binaries that did build.
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - label: Linux ARM64 (Raspberry Pi 3/4/5, 64-bit)
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # macos-13 (Intel) was retired 2025-12-04 and macos-14 (Apple
          # Silicon) is being retired too; macos-15-intel is the current Intel
          # runner (Intel macOS support ends when macos-15 retires in Fall
          # 2027), and macos-15 is the current Apple Silicon runner.
          - label: macOS Intel
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - label: macOS Apple Silicon
            target: aarch64-apple-darwin
            runner: macos-15
          - label: Windows x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - label: Windows ARM64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-webrtc-gpu

      - name: Build
        run: cargo build --release --locked --features webrtc,gpu --bin midwimble --target ${{ matrix.target }}

      # Hand the raw binary to the release job, which packages every platform
      # the same way on one runner. Artifact downloads do not keep the Unix
      # executable bit, so it is restored there before archiving.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: midwimble-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/midwimble${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # for LICENSE and README in each archive

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts # each lands in artifacts/midwimble-<target>/

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || 'auto' }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.name || github.ref_name }}"

          # A release candidate (a version containing "RC") is a pre-release; a
          # final version (v1.0) is a full release. A manual run can force it
          # either way; a tag push always decides from the version.
          case "$PRERELEASE" in
            true)  pre=1 ;;
            false) pre=0 ;;
            *)     shopt -s nocasematch; [[ "$TAG" == *rc* ]] && pre=1 || pre=0; shopt -u nocasematch ;;
          esac

          # One tarball (Unix) or zip (Windows) per target, each holding the
          # binary, the licence (GPL-3.0 requires conveying it with binaries)
          # and the README.
          mkdir -p out
          for dir in artifacts/midwimble-*/; do
            target="$(basename "$dir" | sed 's/^midwimble-//')"
            stem="midwimble-${TAG}-${target}"
            mkdir -p "pkg/${stem}"
            cp LICENSE README.md "pkg/${stem}/"
            case "$target" in
              *windows*)
                cp "${dir}midwimble.exe" "pkg/${stem}/"
                (cd pkg && zip -qr "../out/${stem}.zip" "${stem}")
                ;;
              *)
                cp "${dir}midwimble" "pkg/${stem}/"
                chmod +x "pkg/${stem}/midwimble"
                tar -C pkg -czf "out/${stem}.tar.gz" "${stem}"
                ;;
            esac
          done
          (cd out && sha256sum ./* | tee SHA256SUMS.txt)

          { [ "$pre" = 1 ] && echo "Release candidate **${TAG}** of midwimble." || echo "Release **${TAG}** of midwimble."
            echo
            echo "Built \`--release --features webrtc,gpu\` from commit \`${GITHUB_SHA}\`. Each archive holds one \`midwimble\` binary — node, wallet, pool, merged miner and anchoring — with LICENSE and README."
            echo
            echo "| Download | Platform |"
            echo "| --- | --- |"
            echo "| \`midwimble-${TAG}-x86_64-unknown-linux-gnu.tar.gz\` | Linux x86-64 |"
            echo "| \`midwimble-${TAG}-aarch64-unknown-linux-gnu.tar.gz\` | Linux ARM64 — Raspberry Pi 3 / 4 / 5 on a 64-bit OS |"
            echo "| \`midwimble-${TAG}-x86_64-apple-darwin.tar.gz\` | macOS (Intel) |"
            echo "| \`midwimble-${TAG}-aarch64-apple-darwin.tar.gz\` | macOS (Apple Silicon) |"
            echo "| \`midwimble-${TAG}-x86_64-pc-windows-msvc.zip\` | Windows x64 |"
            echo "| \`midwimble-${TAG}-aarch64-pc-windows-msvc.zip\` | Windows on ARM |"
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS.txt\` (checksums attached)."
          } > notes.md

          flag=""; [ "$pre" = 1 ] && flag="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-cutting a release that already exists, which is what a
            # consensus fix at the same version needs: replace the binaries
            # *and* the notes. Without the edit the page keeps advertising
            # the commit the replaced binaries were built from, which is
            # exactly the claim a re-cut is meant to retract.
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md \
              --prerelease="$([ "$pre" = 1 ] && echo true || echo false)"
          else
            gh release create "$TAG" out/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" $flag
          fi
