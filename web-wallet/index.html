<!DOCTYPE html>
<!-- midwimble's browser wallet. Self-contained, like the explorer: no fonts,
     scripts or images from anywhere else. Keys stay in this browser; it
     reaches nodes over WebRTC (light_client.bundle.js). app.js draws every
     screen into #app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07070a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Midwimble Wallet</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Midwimble">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="wallet.css">
</head>
<body>
<div class="app" id="app"></div>
<noscript><div class="fatal">The wallet needs JavaScript and WebAssembly.</div></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
