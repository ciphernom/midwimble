<!DOCTYPE html>
<!-- Served at / by every midwimble node. Self-contained: no fonts, scripts or
     images from anywhere else, so it works on a machine with no internet.
     Chain data is untrusted: everything is rendered as text, never as HTML. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>midwimble explorer</title>
<style>
  :root {
    --bg: #07070a; --panel: #0e0d14; --panel2: #13111c; --text: #f4f3f7; --muted: #9c98aa;
    --green: #00ff41; --purple: #8b5cf6; --lilac: #a78bfa; --amber: #f5c451;
    --line: rgba(167, 139, 250, .18); --max: 1180px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 13px/1.7 var(--mono); }
  a { color: var(--lilac); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2;
    background: rgba(7, 7, 10, .92); backdrop-filter: blur(8px);
  }
  .bar-top { max-width: var(--max); margin: 0 auto; padding: 12px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
  .brand:hover { text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 50%; }
  .brand b { font: 600 14px var(--sans); letter-spacing: .18em; text-transform: uppercase; }
  nav { display: flex; gap: 14px; font-size: 12px; letter-spacing: .08em; }
  form { flex: 1; display: flex; min-width: 240px; }
  form input {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px 0 0 10px; padding: 8px 12px; font: 500 12px var(--mono); outline: none;
  }
  form input:focus { border-color: var(--lilac); }
  form button {
    background: var(--purple); color: #fff; border: 0; border-radius: 0 10px 10px 0;
    padding: 0 14px; font: 600 12px var(--mono); cursor: pointer;
  }
  #flash { max-width: var(--max); margin: 0 auto; padding: 0 20px; color: var(--amber); font-size: 12px; }
  main { padding: 24px 20px 10px; display: grid; gap: 20px; max-width: var(--max); margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  h2 {
    margin: 0; padding: 13px 20px; font: 700 11px var(--mono); letter-spacing: .18em;
    text-transform: uppercase; color: var(--lilac); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
  }
  h2 .aside { color: var(--muted); letter-spacing: .06em; text-transform: none; font-weight: 500; }
  .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .title h1 { margin: 0; font: 600 22px var(--sans); letter-spacing: .02em; }
  .title .pager { margin-left: auto; display: flex; gap: 10px; }
  .btn { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12px; }
  .btn.off { color: var(--muted); opacity: .45; pointer-events: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .cell { padding: 14px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .k { color: var(--muted); font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .cell .v { font-size: 18px; margin-top: 2px; word-break: break-all; letter-spacing: -.02em; }
  .cell .v.small { font-size: 13px; letter-spacing: 0; }
  .meter { height: 4px; background: rgba(167, 139, 250, .12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--purple), var(--green)); }
  .meter.hot span { background: linear-gradient(90deg, var(--purple), var(--amber)); }
  dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 220px) 1fr; }
  dt, dd { margin: 0; padding: 9px 20px; border-bottom: 1px solid var(--line); }
  dt { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding-top: 11px; }
  dd { word-break: break-all; }
  dl > :nth-last-child(-n+2) { border-bottom: 0; }
  .hash { user-select: all; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 9px 20px; color: var(--muted); font: 600 11px var(--mono);
    letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 8px 20px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: rgba(167, 139, 250, .05); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  .tag {
    display: inline-block; padding: 1px 9px; border-radius: 999px; font: 600 11px var(--mono);
    letter-spacing: .06em; border: 1px solid var(--line); margin-right: 4px;
  }
  .tag.merged { color: var(--lilac); border-color: rgba(167, 139, 250, .45); }
  .tag.native { color: var(--muted); }
  .tag.ok { color: var(--green); border-color: rgba(0, 255, 65, .35); }
  .tag.warn { color: var(--amber); border-color: rgba(245, 196, 81, .4); }
  .empty, .note { color: var(--muted); padding: 14px 20px; }
  .note { font-size: 12px; border-top: 1px solid var(--line); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .charts.two { grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); }
  .chart { padding: 12px 20px 14px; border-right: 1px solid var(--line); }
  .chart svg { width: 100%; height: 120px; display: block; margin-top: 6px; }
  .diagram { padding: 14px 20px 18px; }
  .diagram svg { width: 100%; display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 11px; letter-spacing: .06em; margin-top: 10px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .train { display: flex; gap: 10px; overflow-x: auto; padding: 14px 20px 18px; scrollbar-width: thin; }
  .train a { flex: 0 0 136px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; color: var(--text); transition: transform .18s, border-color .18s; }
  .train a:hover { transform: translateY(-3px); border-color: var(--lilac); text-decoration: none; }
  .train a.fresh { animation: slidein .55s ease-out; border-color: rgba(0, 255, 65, .55); }
  @keyframes slidein { from { opacity: 0; transform: translateX(-26px); } }
  .train .hh { font: 600 15px var(--mono); color: var(--lilac); }
  .train .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  svg a { cursor: pointer; }
  svg a:hover rect, svg a:hover circle, svg a:hover path { opacity: 1; }
  .txrow { border-bottom: 1px solid var(--line); }
  .txrow summary { padding: 10px 20px; cursor: pointer; display: grid; gap: 14px; align-items: center;
    grid-template-columns: minmax(130px, auto) 1fr auto; list-style: none; }
  .txrow summary::-webkit-details-marker { display: none; }
  .txrow summary:hover { background: rgba(167, 139, 250, .05); }
  .txrow[open] summary { background: rgba(167, 139, 250, .07); }
  .txrow .body { padding: 4px 20px 16px; }
  .facts { display: grid; grid-template-columns: minmax(130px, auto) 1fr; gap: 1px 16px; padding: 4px 20px 16px; }
  .facts .who { color: var(--muted); font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 9px 0; white-space: nowrap; }
  .facts .pills { padding: 7px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .facts .yes, .facts .no { border-radius: 999px; padding: 2px 10px; font-size: 12px; border: 1px solid transparent; }
  .facts .yes { color: var(--green); border-color: rgba(0,255,65,.3); background: rgba(0,255,65,.06); }
  .facts .no { color: var(--muted); border-color: var(--line); opacity: .75; }
  .facts .no::before { content: "\00d7 "; opacity: .6; }
  .facts .yes::before { content: "\2713 "; opacity: .7; }
  .heat { display: grid; grid-template-columns: minmax(120px, auto) 1fr minmax(96px, auto); align-items: center; gap: 2px 14px; padding: 14px 20px 18px; }
  .heat svg { width: 100%; height: 13px; display: block; }
  .heat .lab { font-size: 12px; white-space: nowrap; }
  .heat .cnt { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .heat .hd { color: var(--muted); font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; padding: 18px 20px; }
  .flow .step { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--panel2); }
  .flow .arrow { align-self: center; padding: 0 12px; color: var(--muted); font-size: 18px; }
  footer { padding: 18px 20px 34px; color: var(--muted); font-size: 11px; text-align: center; letter-spacing: .05em; }
  @media (max-width: 640px) { dl { grid-template-columns: 1fr; } dt { border-bottom: 0; padding-bottom: 0; } }
</style>
</head>
<body>
<header>
  <div class="bar-top">
    <a class="brand" href="#/"><img src="/logo.svg" alt=""><b>Midwimble</b></a>
    <nav><a href="#/">overview</a><a href="#/blocks">blocks</a><a href="#/bonds">bonds</a><a href="#/mempool">mempool</a><a href="#/privacy">privacy</a><a href="#/network">network</a></nav>
    <form id="search" autocomplete="off">
      <input id="q" placeholder="height, block hash, output commitment, kernel or bond id" spellcheck="false">
      <button>find</button>
    </form>
  </div>
  <div id="flash"></div>
</header>
<main id="view"><div class="empty">loading…</div></main>
<footer>
  Served by this node from its own copy of the chain. JSON: <a href="/state">/state</a>,
  /explorer/{blocks, block/…, output/…, kernel/…, bonds, bond/…, search/…}.
</footer>
<script>
"use strict";
const COIN = 1e8;
const view = document.getElementById("view");

// ---------- small helpers: every value goes in as text --------------------
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    n.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const short = (x, n = 10) => x ? x.slice(0, n) + "…" : "—";
const num = x => Number(x).toLocaleString();
function coins(units) {
  const whole = Math.floor(units / COIN), frac = String(units % COIN).padStart(8, "0");
  return whole.toLocaleString() + "." + frac;
}
// A bond's value is in midstate's base units, not midwimble's, so coins()
// is the wrong scale for it: it divides by midwimble's COIN (1e8) and showed
// a 128 gMDS bond as "1,374.38953472 MDS". Midstate quotes bonds in gMDS,
// 2^30 base units each, which is the unit the network's minimums are set in.
// Midstate's base unit is the MDS itself, and the prefix is binary: a gMDS
// is 2^30 of them, which is how the bond minimums are quoted (mainnet asks
// 128 gMDS, the early phase 2^24 MDS). Large bonds read better in gMDS,
// small ones in plain MDS, so the unit comes back with the number.
const GMDS = 1073741824;
function gmds(units) {
  const u = Number(units);
  if (u < GMDS) return u.toLocaleString() + " MDS";
  const n = u / GMDS;
  return (Number.isInteger(n)
    ? n.toLocaleString()
    : n.toLocaleString(undefined, { maximumFractionDigits: 6 })) + " gMDS";
}
function dur(s) {
  if (s == null) return "—";
  const a = Math.abs(s), sign = s < 0 ? "-" : "";
  if (a < 120) return sign + a + "s";
  if (a < 7200) return sign + Math.round(a / 60) + "m";
  if (a < 172800) return sign + (a / 3600).toFixed(1) + "h";
  return sign + (a / 86400).toFixed(1) + "d";
}
const ago = ts => dur(Math.max(0, Math.floor(Date.now() / 1000) - ts)) + " ago";
const utc = ts => new Date(ts * 1000).toISOString().replace("T", " ").replace(".000Z", " UTC");
function rate(perSec) {
  const units = ["", "k", "M", "G", "T"];
  let i = 0;
  while (perSec >= 1000 && i < units.length - 1) { perSec /= 1000; i++; }
  return perSec.toFixed(perSec < 10 ? 2 : 1) + " " + units[i] + "attempts/s";
}
const link = (kind, id, text) => h("a", { href: "#/" + kind + "/" + id, title: String(id) }, text ?? short(String(id)));
const full = x => h("span", { class: "hash" }, x);
const tag = (cls, text) => h("span", { class: "tag " + cls }, text);
const section = (title, aside, ...body) => h("section", null, h("h2", null, title, aside ? h("span", { class: "aside" }, aside) : null), ...body);
function cell(k, v, small) { return h("div", { class: "cell" }, h("div", { class: "k" }, k), h("div", { class: "v" + (small ? " small" : "") }, v)); }
function meter(fraction, hot) {
  const span = h("span");
  span.style.width = Math.min(100, Math.max(0.6, fraction * 100)) + "%";
  return h("div", { class: "meter" + (hot ? " hot" : "") }, span);
}
const dl = rows => h("dl", null, rows.filter(Boolean).map(([k, v]) => [h("dt", null, k), h("dd", null, v)]));
const table = (heads, rows, numeric = []) => h("div", { class: "scroll" }, h("table", null,
  h("thead", null, h("tr", null, heads.map((x, i) => h("th", { class: numeric.includes(i) ? "num" : null }, x)))),
  h("tbody", null, rows.map(r => h("tr", null, r.map((c, i) => h("td", { class: numeric.includes(i) ? "num" : null }, c)))))));

async function get(path) {
  const r = await fetch(path);
  let body = null;
  try { body = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((body && body.error) || (path + " → " + r.status));
  return body;
}
function flash(text) {
  const f = document.getElementById("flash");
  f.textContent = text;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => (f.textContent = ""), 4000);
}

// ---------- charts --------------------------------------------------------
const SVG = "http://www.w3.org/2000/svg";
function svg(tagName, attrs, ...kids) {
  const n = document.createElementNS(SVG, tagName);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  kids.forEach(k => n.appendChild(k));
  return n;
}
function intervalChart(values, target, href) {
  const W = 600, H = 120, max = Math.max(target * 3, ...values);
  const bw = W / Math.max(values.length, 1);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  values.forEach((v, i) => {
    const bh = Math.max(1, (Math.min(v, max) / max) * (H - 4));
    const r = svg("rect", { x: i * bw + 1, y: H - bh, width: Math.max(1, bw - 2), height: bh,
      fill: v > target * 2.5 ? "#f5c451" : "#8b5cf6", opacity: .85 });
    s.appendChild(href ? svgLink(href(i), r, v + "s") : (r.appendChild(svg("title")).textContent = v + "s", r));
  });
  const y = H - (target / max) * (H - 4);
  s.appendChild(svg("line", { x1: 0, x2: W, y1: y, y2: y, stroke: "#00ff41", "stroke-dasharray": "4 4", "stroke-width": 1 }));
  return s;
}
function lineChart(values) {
  const W = 600, H = 120, lo = Math.min(...values), hi = Math.max(...values), span = (hi - lo) || 1;
  const pts = values.map((v, i) => `${(i / Math.max(values.length - 1, 1)) * W},${H - 6 - ((v - lo) / span) * (H - 12)}`);
  return svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" },
    svg("polyline", { points: pts.join(" "), fill: "none", stroke: "#a78bfa", "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
}

// Wraps a mark so clicking it goes somewhere. Everything the explorer
// draws is a block, so almost everything should be clickable.
function svgLink(href, kid, title) {
  const a = svg("a", { href });
  if (title) kid.appendChild(svg("title")).textContent = title;
  a.appendChild(kid);
  return a;
}

function barChart(values, { colour = "#8b5cf6", log = false, label = String, href = null } = {}) {
  const W = 600, H = 120, f = log ? (v => Math.log10(1 + v)) : (v => v);
  const max = Math.max(...values.map(f), 1e-9), bw = W / Math.max(values.length, 1);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  values.forEach((v, i) => {
    if (!v) return;
    const bh = Math.max(1, (f(v) / max) * (H - 4));
    const r = svg("rect", { x: i * bw, y: H - bh, width: Math.max(0.8, bw - 0.5), height: bh, fill: colour, opacity: .8 });
    s.appendChild(href ? svgLink(href(i), r, label(v, i)) : (r.appendChild(svg("title")).textContent = label(v, i), r));
  });
  return s;
}
/// A 0..1 series as a filled area, for shares that only make sense against
/// their own ceiling.
function shareChart(values, colour, label = String) {
  const W = 600, H = 120, n = Math.max(values.length - 1, 1);
  const pts = values.map((v, i) => `${(i / n) * W},${H - 6 - Math.max(0, Math.min(1, v)) * (H - 12)}`);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" },
    svg("polygon", { points: `0,${H} ` + pts.join(" ") + ` ${W},${H}`, fill: colour, opacity: .18 }),
    svg("polyline", { points: pts.join(" "), fill: "none", stroke: colour, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
  values.forEach((v, i) => {
    const t = svg("rect", { x: (i / n) * W - 1, y: 0, width: 2, height: H, fill: "transparent" });
    t.appendChild(svg("title")).textContent = label(v, i);
    s.appendChild(t);
  });
  return s;
}

// ---------- diagrams ------------------------------------------------------
// Everything below draws what the chain actually records. On this chain a
// block is one aggregated transaction: its inputs and kernels are flattened
// and sorted, so nothing says which input funded which output. The anatomy
// view draws that as the complete set of possibilities rather than leaving
// it unsaid, because the absence of those edges IS the privacy property.
const COL = { in: "#8b5cf6", out: "#00ff41", kern: "#a78bfa", faint: "rgba(167,139,250,.5)" };
const slot = (i, n, from, to) => from + ((i + 0.5) * (to - from)) / Math.max(n, 1);

// Ages colour an input by how long its output sat before this block spent
// it: a cooling ramp, not a warning one -- an old coin is interesting, not
// wrong.
const AGE_BANDS = [[10, "#8b5cf6", "\u226410 blocks"], [100, "#a78bfa", "\u2264100"],
                   [1000, "#c4b5fd", "\u22641k"], [Infinity, "#e9e4ff", ">1k"]];
const ageColour = a => a == null ? "#4a4458" : (AGE_BANDS.find(([hi]) => a <= hi) || AGE_BANDS[3])[1];

function anatomyDiagram(b) {
  const ins = b.inputs || [];
  const groups = (b.output_groups || []).map((g, gi) => ({ ...g, gi, coinbase: false }));
  if (b.coinbase) groups.unshift({ gi: -1, coinbase: true, outputs: b.coinbase.outputs.length,
    range_proof_bytes: b.coinbase.range_proof_bytes, commitments: b.coinbase.outputs.map(o => o.commitment) });
  const outs = [];
  groups.forEach(g => (g.commitments || []).forEach(c => outs.push({ g, c })));
  const kerns = (b.kernels || []).concat(b.coinbase ? [b.coinbase.kernel] : []);
  if (!ins.length && !outs.length) return h("div", { class: "empty" }, "nothing to draw: this block carries no transactions");

  const CAPN = 28;
  const si = ins.slice(0, CAPN), so = outs.slice(0, CAPN), sk = kerns.slice(0, CAPN);
  const W = 760, pad = 24;
  const H = Math.max(170, 2 * pad + Math.max(si.length, so.length, sk.length) * 20);
  const xIn = 96, xKern = W / 2 - 30, xOut = W - 210;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const yi = i => slot(i, si.length, pad, H - pad);
  const yo = i => slot(i, so.length, pad, H - pad);
  const yk = i => slot(i, sk.length, pad + 6, H - pad - 6);

  // Every pairing the chain leaves consistent, drawn behind everything else.
  const edges = si.length * so.length;
  if (edges && edges <= 420) {
    si.forEach((_, i) => so.forEach((_, j) => s.appendChild(svg("line", {
      x1: xIn + 7, y1: yi(i), x2: xOut - 7, y2: yo(j),
      stroke: "rgba(167,139,250,.5)", "stroke-width": 0.4, opacity: Math.max(0.05, 1.6 / Math.sqrt(edges)),
    }))));
  } else if (edges) {
    s.appendChild(svg("path", { d: `M${xIn + 7},${yi(0)} L${xOut - 7},${yo(0)} L${xOut - 7},${yo(so.length - 1)} L${xIn + 7},${yi(si.length - 1)} Z`,
      fill: "rgba(167,139,250,.5)", opacity: .07 }));
  }

  // Kernels float in the middle on their own backing, deliberately wired to
  // nothing: a kernel proves some transaction balanced, never which one.
  sk.forEach((k, i) => {
    const y = yk(i);
    s.appendChild(svg("rect", { x: xKern - 30, y: y - 8, width: 60, height: 16, rx: 8, fill: "#07070a", opacity: .92 }));
    const d = svg("path", { d: `M${xKern - 7},${y} L${xKern},${y - 6} L${xKern + 7},${y} L${xKern},${y + 6} Z`,
      fill: "#a78bfa", opacity: .9 });
    d.appendChild(svg("title")).textContent =
      (k.fee ? "fee " + coins(k.fee) : "no fee") + "\n" + k.excess + "\nproves a transaction balanced \u2014 not which one";
    s.appendChild(d);
  });

  si.forEach((inp, i) => {
    const age = inp.created_height != null ? b.height - inp.created_height : null;
    const r = svg("rect", { x: xIn - 7, y: yi(i) - 6, width: 14, height: 12, rx: 3, fill: ageColour(age), opacity: .9 });
    r.appendChild(svg("title")).textContent = inp.commitment +
      (age != null ? "\ncreated in block " + inp.created_height + " \u2014 " + age + " blocks earlier" : "\ncreating block not indexed");
    s.appendChild(r);
  });

  // Outputs, boxed by the transaction that made them. Hovering a box lifts
  // its members and dims the rest: the one link aggregation leaves standing.
  const allOut = [];
  groups.forEach(g => {
    const mine = so.map((o, i) => [o, i]).filter(([o]) => o.g === g).map(([, i]) => i);
    if (!mine.length) return;
    const top = yo(mine[0]) - 11, bot = yo(mine[mine.length - 1]) + 11;
    const stroke = g.coinbase ? "rgba(245,196,81,.45)" : "rgba(0,255,65,.3)";
    const box = svg("rect", { x: xOut - 13, y: top, width: 186, height: bot - top, rx: 7,
      fill: g.coinbase ? "rgba(245,196,81,.05)" : "rgba(0,255,65,.05)", stroke, "stroke-width": 1 });
    s.appendChild(box);
    const t = svg("text", { x: xOut + 20, y: (top + bot) / 2 + 4, fill: g.coinbase ? "#f5c451" : "#00ff41", "font-size": 10, opacity: .9 });
    t.textContent = (g.coinbase ? "coinbase" : "tx") + " \u00b7 " + g.outputs + " out \u00b7 " + g.range_proof_bytes + "B";
    s.appendChild(t);
    const mates = mine.map(i => {
      const o = so[i];
      const r = svg("rect", { x: xOut - 7, y: yo(i) - 6, width: 14, height: 12, rx: 3,
        fill: g.coinbase ? "#f5c451" : "#00ff41", opacity: .85 });
      r.appendChild(svg("title")).textContent = o.c + (g.coinbase ? "\ncoinbase output, value public" : "\ncreated with " + (g.outputs - 1) + " sibling" + (g.outputs === 2 ? "" : "s"));
      s.appendChild(r);
      allOut.push(r);
      return r;
    });
    if (g.outputs > 1) {
      const lift = on => allOut.forEach(r => r.setAttribute("opacity", mates.includes(r) ? (on ? 1 : .85) : (on ? .2 : .85)));
      [box, t].forEach(e => { e.addEventListener("mouseenter", () => lift(true)); e.addEventListener("mouseleave", () => lift(false)); });
      box.setAttribute("style", "cursor: help");
    }
  });

  const label = (x, y, txt, fill, anchor) => {
    const t = svg("text", { x, y, fill, "font-size": 11, "text-anchor": anchor || "start" });
    t.textContent = txt;
    return t;
  };
  s.appendChild(label(xIn, 14, ins.length + " inputs", "#8b5cf6", "middle"));
  s.appendChild(label(xKern, 14, kerns.length + " kernels", "#a78bfa", "middle"));
  const funded = (b.outputs || []).length;
  s.appendChild(label(xOut + 10, 14, funded + " outputs" + (b.coinbase ? " + coinbase" : ""), "#00ff41", "middle"));
  s.appendChild(label(xKern, H - 6, "wired to nothing \u2014 a kernel proves a transaction balanced, never which one", "#9c98aa", "middle"));
  if (ins.length > CAPN) s.appendChild(label(xIn, H - 6, "+" + (ins.length - CAPN) + " more", "#9c98aa", "middle"));

  // The coinbase is minted rather than funded, so it is not a candidate for
  // any input and stays out of the count.
  const pairings = ins.length * funded;
  return h("div", { class: "diagram" }, s,
    h("div", { class: "legend" },
      h("span", null, h("i", { style: "background:#00ff41" }), "output \u00b7 boxed with its transaction's siblings"),
      h("span", null, h("i", { style: "background:#f5c451" }), "coinbase \u00b7 value public"),
      h("span", null, h("i", { style: "background:#a78bfa" }), "kernel"),
      ...AGE_BANDS.map(([, c, t]) => h("span", null, h("i", { style: "background:" + c }), "input " + t))),
    h("div", { class: "legend" }, h("span", null,
      pairings
        ? num(ins.length) + " inputs \u00d7 " + num(funded) + " funded outputs = " + num(pairings) + " assignments the chain leaves consistent"
        : "nothing to pair: this block spends nothing")));
}

// Where this block's coins came from and went. The only transaction graph
// this chain records: an output knows its creating block and its spending
// block, and nothing in between.
function spendArcs(b) {
  const back = new Map(), fwd = new Map();
  (b.inputs || []).forEach(i => i.created_height != null && back.set(i.created_height, (back.get(i.created_height) || 0) + 1));
  (b.outputs || []).concat((b.coinbase && b.coinbase.outputs) || [])
    .forEach(o => o.spent_height != null && fwd.set(o.spent_height, (fwd.get(o.spent_height) || 0) + 1));
  if (!back.size && !fwd.size) return h("div", { class: "empty" }, "no spends to or from this block yet");

  const dists = [...back.keys(), ...fwd.keys()].map(x => Math.abs(x - b.height));
  const span = Math.log10(1 + Math.max(1, ...dists));
  const W = 680, H = 190, mid = H / 2, half = W / 2 - 30;
  const xOf = hh => {
    const d = hh - b.height;
    return W / 2 + (Math.sign(d) * Math.log10(1 + Math.abs(d)) / (span || 1)) * half;
  };
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  s.appendChild(svg("line", { x1: 14, y1: mid, x2: W - 14, y2: mid, stroke: "rgba(167,139,250,.25)", "stroke-width": 1 }));
  const arc = (hh, n, up, colour) => {
    const x = xOf(hh), lift = (up ? -1 : 1) * (mid - 18);
    const p = svg("path", { d: `M${x},${mid} Q${(x + W / 2) / 2},${mid + lift} ${W / 2},${mid}`,
      fill: "none", stroke: colour, "stroke-width": Math.min(4, 0.8 + Math.log2(1 + n)), opacity: .55 });
    const tip = n + (n === 1 ? " output" : " outputs") + (up ? " created in block " : " spent in block ") + hh +
      " (" + Math.abs(hh - b.height) + " blocks " + (up ? "earlier" : "later") + ")";
    // A 1-4px arc is a miserable click target, so each one carries an
    // invisible fat stroke underneath purely to be hit.
    const hit = svg("path", { d: p.getAttribute("d"), fill: "none", stroke: "transparent", "stroke-width": 14 });
    const a = svgLink("#/block/" + hh, hit, tip);
    a.appendChild(p);
    s.appendChild(a);
    s.appendChild(svgLink("#/block/" + hh, svg("circle", { cx: x, cy: mid, r: 2.5, fill: colour, opacity: .8 })));
  };
  [...back.entries()].forEach(([hh, n]) => arc(hh, n, true, COL.in));
  [...fwd.entries()].forEach(([hh, n]) => arc(hh, n, false, COL.out));
  s.appendChild(svg("circle", { cx: W / 2, cy: mid, r: 4.5, fill: "#f4f3f7" }));
  const txt = (x, y, t, fill, anchor) => {
    const e = svg("text", { x, y, fill, "font-size": 11, "text-anchor": anchor });
    e.textContent = t;
    return e;
  };
  s.appendChild(txt(W / 2, mid - 10, "block " + num(b.height), "#f4f3f7", "middle"));
  s.appendChild(txt(14, 14, "spent here, created earlier \u2191", COL.in, "start"));
  s.appendChild(txt(14, H - 6, "created here, spent later \u2193", COL.out, "start"));
  s.appendChild(txt(W - 14, mid + 16, "later \u2192", "#9c98aa", "end"));
  s.appendChild(txt(14, mid + 16, "\u2190 earlier", "#9c98aa", "start"));
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, "distance is logarithmic, so a coinbase spent thousands of blocks later stays on the chart"),
    h("span", null, "thickness is how many outputs share that block")));
}

// The ages of the outputs this block spent: fresh coinbase looks nothing
// like a dormant coin waking up, and that difference is one of the few
// patterns visible on a chain with no amounts and no addresses.
function ageHistogram(b) {
  const ages = (b.inputs || []).map(i => i.created_height != null ? b.height - i.created_height : null).filter(x => x != null);
  if (!ages.length) return null;
  const buckets = [[1, 1, "same\u2011ish"], [2, 10, "2\u201310"], [11, 100, "11\u2013100"], [101, 1000, "101\u20131k"],
                   [1001, 10000, "1k\u201310k"], [10001, Infinity, "10k+"]];
  const counts = buckets.map(([lo, hi]) => ages.filter(a => a >= lo && a <= hi).length);
  const W = 680, H = 96, max = Math.max(1, ...counts), bw = W / counts.length;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}` });
  counts.forEach((c, i) => {
    const bh = (c / max) * (H - 34);
    if (c) {
      const r = svg("rect", { x: i * bw + bw * 0.3, y: H - 22 - bh, width: bw * 0.4, height: Math.max(2, bh), rx: 3, fill: COL.in, opacity: .8 });
      r.appendChild(svg("title")).textContent = c + " spent after " + buckets[i][2] + " blocks";
      s.appendChild(r);
      const v = svg("text", { x: i * bw + bw / 2, y: H - 26 - bh, fill: "#f4f3f7", "font-size": 11, "text-anchor": "middle" });
      v.textContent = c;
      s.appendChild(v);
    }
    const t = svg("text", { x: i * bw + bw / 2, y: H - 6, fill: "#9c98aa", "font-size": 10, "text-anchor": "middle" });
    t.textContent = buckets[i][2];
    s.appendChild(t);
  });
  return h("div", { class: "diagram" }, s,
    h("div", { class: "legend" }, h("span", null, "blocks between an output being created and this block spending it")));
}

// Who learns what, as pills rather than paragraphs: a reader should be able
// to scan a row in a second and hover the diagram for the rest.
function facts(rows) {
  const grid = h("div", { class: "facts" });
  rows.forEach(([who, knows, blind]) => {
    grid.appendChild(h("div", { class: "who" }, who));
    grid.appendChild(h("div", { class: "pills" },
      knows.map(k => h("span", { class: "yes" }, k)),
      blind.map(k => h("span", { class: "no" }, k))));
  });
  return grid;
}

// Dandelion++: a transaction does not go straight to the gossip network.
// It walks a private stem, one peer at a time, and only then fluffs out to
// everyone. The fluff probability is not fixed -- `Node::route_stem` sets it
// to 100/outbound peers, clamped to 2..50 -- so a better-connected node
// stems further before broadcasting.
function dandelionDiagram(d) {
  const W = 760, H = 230, y = 118, x0 = 58, xF = 568;
  const hops = Math.max(1, Math.min(5, Math.round(d.expected_hops)));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const dot = (cx, cy, r, fill, op) => svg("circle", { cx, cy, r, fill, opacity: op == null ? 1 : op });
  const txt = (x, yy, t, fill, anchor, size) => {
    const e = svg("text", { x, y: yy, fill, "font-size": size || 11, "text-anchor": anchor || "middle" });
    e.textContent = t;
    return e;
  };
  const step = (xF - x0) / (hops + 1);

  s.appendChild(svg("line", { x1: x0, y1: y, x2: xF, y2: y, stroke: "#8b5cf6", "stroke-width": 2, opacity: .45 }));
  // The fluff: everyone this node gossips to, and onward.
  const fan = 11;
  for (let i = 0; i < fan; i++) {
    const a = -1.15 + (i / (fan - 1)) * 2.3, len = 74 + (i % 3) * 16;
    const ex = xF + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    s.appendChild(svg("line", { x1: xF, y1: y, x2: ex, y2: ey, stroke: "#00ff41", "stroke-width": 1, opacity: .3 }));
    s.appendChild(dot(ex, ey, 3.5, "#00ff41", .75));
  }
  const burst = dot(xF, y, 6, "none", 1);
  burst.setAttribute("stroke", "#00ff41");
  burst.setAttribute("fill", "none");
  burst.appendChild(svg("animate", { attributeName: "r", values: "6;64", dur: "1.6s", begin: "2.4s;burst.end+2.4s", id: "burst", repeatCount: "1" }));
  burst.appendChild(svg("animate", { attributeName: "opacity", values: ".9;0", dur: "1.6s", begin: "2.4s;burst.end+2.4s", repeatCount: "1" }));
  s.appendChild(burst);

  // The explanation lives in the picture: hover a node and the caption says
  // what that node knows. One line at a time beats six paragraphs nobody
  // reads.
  const base = d.fluff_percent + "% chance of fluffing at each hop \u00b7 about " + d.expected_hops.toFixed(1) + " hops \u00b7 " + d.stem_timeout_secs + "s embargo";
  const caption = txt(W / 2, H - 10, base, "#9c98aa", "middle", 11);
  const tells = (node, what, colour) => {
    const hit = svg("circle", { cx: node.cx, cy: y, r: 22, fill: "transparent", style: "cursor: help" });
    hit.addEventListener("mouseenter", () => { caption.textContent = what; caption.setAttribute("fill", colour); });
    hit.addEventListener("mouseleave", () => { caption.textContent = base; caption.setAttribute("fill", "#9c98aa"); });
    s.appendChild(hit);
  };
  for (let i = 0; i <= hops; i++) {
    const cx = x0 + step * i;
    s.appendChild(dot(cx, y, i === 0 ? 9 : 6, i === 0 ? "#f4f3f7" : "#8b5cf6", i === 0 ? 1 : .85));
    if (i === 0) s.appendChild(txt(cx, y - 20, "you", "#f4f3f7"));
    else s.appendChild(txt(cx, y - 18, "hop " + i, "#9c98aa", "middle", 10));
    tells({ cx }, i === 0
      ? "you hold it \u00b7 nobody else has seen it yet"
      : i === 1
        ? "knows your address, and that you sent it \u2014 not that you wrote it"
        : "knows only the hop before it \u00b7 " + i + " nodes from you now",
      i === 0 ? "#f4f3f7" : "#a78bfa");
  }
  s.appendChild(dot(xF, y, 9, "#00ff41"));
  s.appendChild(txt(xF, y - 22, "fluff", "#00ff41"));
  tells({ cx: xF }, "broadcasts to everyone \u00b7 what they see is a node that probably did not write it", "#00ff41");

  // The travelling transaction.
  const car = dot(0, 0, 4.5, "#f5c451");
  car.appendChild(svg("animateMotion", { dur: "2.4s", repeatCount: "indefinite", path: `M${x0},${y} L${xF},${y}` }));
  s.appendChild(car);

  s.appendChild(txt(W / 2, 30, "stem \u00b7 one peer at a time, nobody else sees it", "#a78bfa"));
  s.appendChild(txt(x0, H - 34, "your node", "#9c98aa", "start", 10));
  s.appendChild(txt(xF + 86, H - 34, "the whole network", "#9c98aa", "end", 10));
  s.appendChild(caption);
  return h("div", { class: "diagram" }, s);
}

// This node's peers, outbound (ones it chose) distinguished from inbound
// (ones that chose it). Addresses arrive already stripped of their host.
function peerMap(n) {
  const peers = n.peers || [];
  if (!peers.length) return h("div", { class: "empty" }, "no peers connected");
  const W = 760, H = 330, cx = W / 2, cy = H / 2, R = 128;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const COLOURS = { tcp: "#8b5cf6", quic: "#a78bfa", webrtc: "#00ff41", other: "#9c98aa" };
  peers.forEach((p, i) => {
    const a = (i / peers.length) * Math.PI * 2 - Math.PI / 2;
    const rr = R + (p.outbound ? 0 : 42);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    s.appendChild(svg("line", { x1: cx, y1: cy, x2: x, y2: y,
      stroke: p.outbound ? "#00ff41" : "#8b5cf6", "stroke-width": p.outbound ? 1.4 : 0.8,
      opacity: p.outbound ? .4 : .22, "stroke-dasharray": p.outbound ? null : "3 4" }));
    const c = svg("circle", { cx: x, cy: y, r: p.outbound ? 6 : 4.5,
      fill: COLOURS[p.transport] || COLOURS.other, opacity: p.outbound ? .95 : .6 });
    c.appendChild(svg("title")).textContent =
      p.id + "\n" + (p.outbound ? "outbound \u2014 this node dialled it" : "inbound \u2014 it dialled this node") +
      "\n" + p.transport + " \u00b7 " + p.addr;
    s.appendChild(c);
  });
  const me = svg("circle", { cx, cy, r: 11, fill: "#f4f3f7" });
  s.appendChild(svg("circle", { cx, cy, r: 11, fill: "none", stroke: "#f4f3f7", "stroke-width": 1, opacity: .5 },
    svg("animate", { attributeName: "r", values: "11;34", dur: "3s", repeatCount: "indefinite" }),
    svg("animate", { attributeName: "opacity", values: ".5;0", dur: "3s", repeatCount: "indefinite" })));
  s.appendChild(me);
  const lab = svg("text", { x: cx, y: cy + 30, fill: "#f4f3f7", "font-size": 11, "text-anchor": "middle" });
  lab.textContent = "this node";
  s.appendChild(lab);
  // Direction is the line, transport is the dot: say so, rather than
  // leaving a swatch to imply that green means outbound when it means
  // webrtc.
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, h("i", { style: "background:" + COLOURS.tcp }), "tcp"),
    h("span", null, h("i", { style: "background:" + COLOURS.quic }), "quic"),
    h("span", null, h("i", { style: "background:" + COLOURS.webrtc }), "webrtc"),
    h("span", null, "solid line, larger dot \u2014 outbound, a peer this node chose"),
    h("span", null, "dashed line \u2014 inbound, a peer that dialled in"),
    h("span", null, "addresses are shown without their host \u2014 see below")));
}

// Who signed when, across the fork-choice window. Sparse by construction:
// one tick per block, so the whole window costs at most `size` marks.
function signerHeatmap(r) {
  const w = r.window;
  if (w.from == null || !r.bonds.length) return null;
  const size = Math.max(1, w.size), W = 1000;
  const rows = r.bonds.filter(b => (b.window_blocks || []).length);
  if (!rows.length) return h("div", { class: "empty" }, "no bond has signed inside the window yet");
  const grid = h("div", { class: "heat" },
    h("div", { class: "hd" }, "bond"),
    h("div", { class: "hd" }, "window \u00b7 " + num(w.from) + " \u2192 " + num(w.tip)),
    h("div", { class: "hd", style: "text-align:right" }, "signed / cap"));
  rows.forEach(b => {
    const over = b.window_signed > w.cap;
    const s = svg("svg", { viewBox: `0 0 ${W} 13`, preserveAspectRatio: "none" });
    s.appendChild(svg("rect", { x: 0, y: 0, width: W, height: 13, rx: 2, fill: "rgba(167,139,250,.07)" }));
    (b.window_blocks || []).forEach(hh => {
      const x = ((hh - w.from) / size) * W;
      const t = svg("rect", { x: Math.max(0, Math.min(W - 2, x)), y: 1, width: 2, height: 11,
        fill: over ? "#f5c451" : COL.out, opacity: .85 });
      s.appendChild(svgLink("#/block/" + hh, t, "block " + hh));
    });
    grid.appendChild(h("div", { class: "lab" }, link("bond", b.bond_id, short(b.bond_id, 12))));
    grid.appendChild(s);
    grid.appendChild(h("div", { class: "cnt", style: over ? "color: var(--amber)" : null },
      num(b.window_signed) + " / " + num(w.cap)));
  });
  return h("div", null, grid, h("div", { class: "note" },
    "One tick per block signed. Amber is over cap: those blocks add 1/1024 of their work"
    + (w.tapering ? " and mint cap/n." : ", and from the mainnet switch will mint cap/n.")
    + " Clustered ticks are a mined run; an even spread is a shared window."));
}

// ---------- shared block table --------------------------------------------
function blockRows(blocks) {
  return blocks.map(b => [
    link("block", b.height, num(b.height)),
    h("span", { class: "dim", title: utc(b.timestamp) }, ago(b.timestamp)),
    dur(b.interval),
    `${b.inputs} / ${b.outputs} / ${b.kernels}`,
    b.fees ? coins(b.fees) : h("span", { class: "dim" }, "0"),
    num(b.size),
    b.miner ? link("bond", b.miner) : h("span", { class: "dim" }, "unsigned"),
    [tag(b.merged ? "merged" : "native", b.merged ? "merge-mined" : "native"),
     b.registrations ? tag("ok", "+" + b.registrations + " bond") : null],
  ]);
}
// The newest blocks as a strip you can click straight into.
//
// The strip is kept, not rebuilt. A refresh that brings no new block must
// touch nothing: rebuilding it every ten seconds would throw away the
// reader's scroll position and whatever they were hovering, and would make
// the train lurch when the chain had not moved at all. So the element
// persists across renders, new blocks are inserted at the front, and only
// those carry the slide-in. `view.replaceChildren` moves this node rather
// than copying it, so re-appending the same element keeps its children.
let trainEl = null, trainTop = null, trainTopHash = null;
const TRAIN_CARDS = 14;
function blockTrain(blocks) {
  // Detaching a scrollable element resets its scroll, and `replaceChildren`
  // detaches this one on every render. Keeping the node is not enough on its
  // own: where the reader had scrolled to has to be put back after it is
  // re-attached.
  const keep = trainEl ? trainEl.scrollLeft : 0;
  let rebuilt = false;
  const card = b => {
    const age = h("div", { class: "sub" }, ago(b.timestamp));
    const el = h("a", { href: "#/block/" + b.height },
      h("div", { class: "hh" }, num(b.height)),
      age,
      h("div", { class: "sub" }, (b.kernels || 0) + " tx \u00b7 " + num(b.size) + " B"),
      h("div", { class: "sub" }, b.merged ? "merge-mined" : "native"));
    el._ts = b.timestamp;
    el._age = age;
    return el;
  };
  const rebuild = () => {
    trainEl = h("div", { class: "train" });
    blocks.slice(0, TRAIN_CARDS).forEach(b => trainEl.appendChild(card(b)));
    rebuilt = true;
  };
  if (!blocks.length) return trainEl || (trainEl = h("div", { class: "train" }));
  const top = blocks[0];
  if (!trainEl || trainTop == null) {
    rebuild();
  } else if (top.height < trainTop || (top.height === trainTop && top.hash !== trainTopHash)) {
    // A reorg replaced what the strip is showing, so it is no longer the
    // chain: start again rather than animate blocks that were never added.
    rebuild();
  } else {
    // Oldest first, so each lands at the front in the order it arrived.
    blocks
      .filter(b => b.height > trainTop)
      .sort((a, b) => a.height - b.height)
      .forEach(b => {
        const el = card(b);
        el.classList.add("fresh");
        trainEl.insertBefore(el, trainEl.firstChild);
        // Dropped once it has played, so moving the strip into a freshly
        // rendered page cannot replay it.
        setTimeout(() => el.classList.remove("fresh"), 700);
      });
    while (trainEl.children.length > TRAIN_CARDS) trainEl.removeChild(trainEl.lastChild);
  }
  // Ages would otherwise freeze at whatever they were when the card was
  // made, so they are refreshed in place rather than by rebuilding.
  for (const el of trainEl.children) if (el._age) el._age.textContent = ago(el._ts);
  trainTop = top.height;
  trainTopHash = top.hash;
  // After a rebuild the strip is a different chain, so it starts at the
  // newest; otherwise the reader goes back where they were, once the node
  // is attached again.
  const scroll = rebuilt ? 0 : keep;
  if (scroll) {
    const el = trainEl;
    requestAnimationFrame(() => { el.scrollLeft = scroll; });
  }
  return trainEl;
}

async function overview() {
  const [s, recent, bonds] = await Promise.all([get("/state"), get("/explorer/blocks?count=100"), get("/explorer/bonds")]);
  const blocks = recent.blocks;
  const timed = blocks.filter(b => b.interval != null).slice().reverse();
  const intervals = timed.map(b => b.interval);
  const avg = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : null;
  const bits = blocks.length ? blocks[0].difficulty_bits : 0;
  const hashrate = avg ? Math.pow(2, bits) / Math.max(avg, 1) : null;
  const supplyCell = cell("supply", coins(s.supply));
  supplyCell.appendChild(meter(s.supply / s.max_supply));
  const stats = h("div", { class: "grid" },
    cell("height", num(s.height)),
    cell("last block", ago(s.timestamp)),
    supplyCell,
    cell("block reward", coins(s.block_reward)),
    cell("era · next halving", `${s.era} · ${s.next_halving_height ? num(s.next_halving_height) : "none"}`, true),
    cell("difficulty", bits.toFixed(2) + " bits"),
    cell("network rate", hashrate ? rate(hashrate) : "—", true),
    cell("avg block time", avg ? dur(Math.round(avg)) + " (last " + intervals.length + ")" : "—", true),
    cell("mempool", s.mempool_count + " tx · " + num(s.mempool_weight) + " wt", true),
    cell("utxos / kernels", num(s.utxos) + " / " + num(s.kernels), true),
    cell("peers", String(s.peers.length)),
    cell("this node", (s.mining ? "mining" : "not mining") + (s.syncing ? ", syncing" : ""), true));
  const charts = h("div", { class: "charts" },
    h("div", { class: "chart" }, h("div", { class: "k" }, "block interval · last " + intervals.length + " · dashed = 60s · click a bar"),
      intervalChart(intervals, 60, i => "#/block/" + timed[i].height)),
    h("div", { class: "chart" }, h("div", { class: "k" }, "difficulty (bits) · last " + blocks.length), lineChart(blocks.map(b => b.difficulty_bits).reverse())));
  view.replaceChildren(
    section("Chain", "refreshes every 10s", stats, charts),
    section("Latest blocks", h("a", { href: "#/blocks" }, "all blocks →"), blockTrain(blocks), blockTable(blocks.slice(0, 15))),
    section("Mining bonds", h("a", { href: "#/bonds" }, "details →"), bondTable(bonds)));
  schedule(overview, 10000);
}

function bondTable(r) {
  const w = r.window;
  if (!r.bonds.length) return h("div", { class: "empty" }, "no bonds registered");
  return h("div", null, table(["bond", "value", "locked to", "eligible", "window · cap " + num(w.cap) + " of " + num(w.size), "blocks signed", "mints"],
    r.bonds.map(b => {
      const share = b.window_signed / Math.max(w.cap, 1);
      // Past its cap a bond mints cap/n of the reward; the rest is burned.
      const over = w.tapering && b.window_signed > w.cap;
      const pay = over ? w.cap / b.window_signed : 1;
      return [
        link("bond", b.bond_id, short(b.bond_id, 14)),
        b.value != null ? gmds(b.value) : "—",
        b.bonded_until != null ? num(b.bonded_until) : "—",
        b.eligible_now ? h("span", { style: "color: var(--green)" }, "yes") : h("span", { style: "color: var(--amber)" }, "no"),
        h("div", { style: "min-width: 170px" }, num(b.window_signed) + " / " + num(w.cap) + (share >= 1 ? "  over cap" : ""), meter(share, share >= 1)),
        num(b.blocks_signed),
        w.tapering
          ? (over
              ? h("span", { style: "color: var(--amber)" }, (pay * 100).toFixed(1) + "%")
              : h("span", { style: "color: var(--green)" }, "100%"))
          : h("span", { class: "dim" }, "—"),
      ];
    }), [5, 6]),
    h("div", { class: "note" }, "Fork choice counts a bond's blocks at full weight up to its cap over the last " + num(w.size) + " blocks; past the cap they stay valid but add only 1/1024 of their work. The cap is an equal share among eligible bonds, never below 1/360. No block counts for more than a quarter above the lowest-work block of the week before it." + (w.tapering ? " Past the cap a block also mints less: a bond that signed n of the window keeps cap/n of each block's subsidy, and what is withheld is never minted by anyone." : " From the mainnet switch, an over-cap block will also mint only cap/n of its subsidy, the rest never minted \u2014 mints shows what each bond would keep.")),
    h("div", { class: "note" }, w.retargeting
      ? "A new bond must lock at least " + gmds(w.min_bond) + " at this chain's difficulty"
        + (w.min_bond > w.min_bond_floor
            ? " \u2014 up from the launch minimum of " + gmds(w.min_bond_floor) + ", because midwimble's work has risen. "
            : ", the launch minimum. ")
        + "The bar doubles with every 16-fold rise in midwimble's work, to a ceiling of " + gmds(w.min_bond_ceiling)
        + ", and applies only to registrations: a bond already above keeps the price it registered at until its lock ends."
      : "From " + utc(w.retarget_from) + " a new bond's minimum follows midwimble's own difficulty, doubling with every 16-fold rise in work from " + gmds(w.min_bond_floor) + " up to " + gmds(w.min_bond_ceiling) + ". It will apply to registrations only \u2014 a bond already registered keeps the price it registered at."));
}

async function privacyPage() {
  const r = await get("/explorer/blocks?count=200");
  const b = r.blocks.slice().reverse();                // oldest first
  const outs = b.map(x => x.body_outputs != null ? x.body_outputs : x.outputs);
  const txs = b.map(x => x.kernels);                   // one kernel, one transaction
  const linked = b.map(x => x.linked_outputs || 0);
  const pairs = b.map((x, i) => x.inputs * outs[i]);
  const mix = b.map((x, i) => txs[i] ? (x.inputs + outs[i]) / txs[i] : 0);
  const carried = b.map((x, i) => i).filter(i => outs[i] > 0);
  const share = carried.map(i => linked[i] / outs[i]);

  const sum = a => a.reduce((p, c) => p + c, 0);
  const busy = b.filter((_, i) => txs[i] > 0).length;
  const totOut = sum(outs), totLinked = sum(linked), totTx = sum(txs);
  const meanPairs = busy ? sum(pairs) / busy : 0;
  const meanMix = busy ? sum(mix.filter((_, i) => txs[i] > 0)) / busy : 0;
  const pct = x => (x * 100).toFixed(1) + "%";

  const stats = h("div", { class: "grid" },
    cell("blocks examined", num(b.length)),
    cell("carried a transaction", num(busy)),
    cell("transactions", num(totTx)),
    cell("mean pairings a block", busy ? num(Math.round(meanPairs)) : "\u2014"),
    cell("outputs with a public sibling", totOut ? pct(totLinked / totOut) : "\u2014"),
    cell("mean aggregation", busy ? meanMix.toFixed(2) + " in+out per tx" : "\u2014", true));

  const charts = h("div", { class: "charts two" },
    h("div", { class: "chart" }, h("div", { class: "k" }, "pairings a block permits \u00b7 log scale"),
      barChart(pairs, { log: true, colour: "#8b5cf6", label: (v, i) => v + " pairings in block " + b[i].height })),
    h("div", { class: "chart" }, h("div", { class: "k" }, "share of outputs with a public sibling \u00b7 blocks carrying transactions"),
      carried.length
        ? shareChart(share, "#f5c451", (v, k) => pct(v) + " of " + outs[carried[k]] + " outputs in block " + b[carried[k]].height)
        : h("div", { class: "empty" }, "no transactions in this span")),
    h("div", { class: "chart" }, h("div", { class: "k" }, "transactions a block"),
      barChart(txs, { colour: "#00ff41", label: (v, i) => v + " in block " + b[i].height })),
    h("div", { class: "chart" }, h("div", { class: "k" }, "aggregation \u00b7 inputs+outputs per transaction"),
      barChart(mix, { colour: "#a78bfa", label: (v, i) => v.toFixed(2) + " in block " + b[i].height })));

  view.replaceChildren(
    h("div", { class: "title" }, h("h1", null, "Privacy"), h("span", { class: "dim" }, "what this chain does and does not reveal, over its last " + num(b.length) + " blocks")),
    section("Measured", "refreshes every 20s", stats, charts),
    section("What each number means", null, dl([
      ["pairings", "inputs \u00d7 outputs \u2014 the assignments the chain leaves consistent. A busy block is a private one."],
      ["public sibling", "outputs sharing a range proof came from one transaction. The one link aggregation does not erase."],
      ["transactions", "one kernel, one transaction that balanced here."],
      ["aggregation", "inputs+outputs per transaction \u2014 how much unrelated traffic merged into one body."],
    ]), h("div", { class: "note" }, "No amount, address or sender is read: the chain records none. These measure how much the aggregation hides.")));
  schedule(privacyPage, 20000);
}

        barChart(txs.map(rate), { colour: "#f5c451", label: (v, i) => num(Math.round(v)) + " units per weight \u00b7 " + short(txs[i].hash, 12) }))) : null),
    section("Transactions", m.listed < m.count ? "showing " + num(m.listed) + " of " + num(m.count) : null,
      txs.length ? list : h("div", { class: "empty" }, "nothing waiting"),
      h("div", { class: "note" }, "Here each of these is a separate transaction, with its own inputs, outputs and kernel. The block that takes them aggregates them \u2014 inputs and kernels flattened and sorted \u2014 and these boundaries stop existing. Every output above is already a working link: follow it after the block lands and it resolves to the block that created it.")));
  schedule(mempoolPage, 5000);
}

async function networkPage() {
  const n = await get("/explorer/network");
  const d = n.dandelion;
  view.replaceChildren(
    h("div", { class: "title" }, h("h1", null, "Network"), h("span", { class: "dim" }, "how a transaction reaches the chain, and who can watch it happen")),
    section("Dandelion++", "as this node would route a transaction right now", dandelionDiagram(d)),
    section("Measured", null, h("div", { class: "grid" },
      cell("fluff chance a hop", d.fluff_percent + "%"),
      cell("expected stem hops", d.expected_hops.toFixed(1)),
      cell("embargo", d.stem_timeout_secs + "s", true),
      cell("in the stem pool", num(d.stem_pool) + " of " + num(d.max_stem_pool), true),
      cell("outbound peers", num(n.outbound)),
      cell("inbound peers", num(n.inbound)))),
    section("Peers", num((n.peers || []).length) + " connected \u00b7 " + num(n.banned) + " banned", peerMap(n)),
    section("Who sees what", "hover the stem above", facts([
      ["the peer you stem to", ["your address", "a transaction from you"], ["whether you wrote it"]],
      ["a later stem hop", ["the hop before it"], ["where the stem began", "how long it already is"]],
      ["first to see the fluff", ["a transaction"], ["its author", "how many were merged into it"]],
      ["a node watching everything", ["timing", "who fluffed first"], ["certainty"]],
      ["anyone with the chain", ["commitments", "kernels", "block shape"], ["amounts", "addresses", "senders"]],
      ["anyone reading this page", ["peer ids", "directions", "transports"], ["peer addresses"]],
    ]), h("div", { class: "note" }, "Timing is the real limit: enough well-connected nodes can still guess an origin. Dandelion++ raises the cost of that guess \u2014 it does not remove it, and no deployed design does.")));
  schedule(networkPage, 15000);
}

// ---------- routing, refresh, search ---------------------------------------
let timer = null, generation = 0;
function schedule(fn, ms) {
  const mine = generation;
  clearTimeout(timer);
  timer = setTimeout(() => { if (mine === generation) fn().catch(() => {}); }, ms);
}
const routes = [
  [/^#?\/?$/, overview],
  [/^#\/blocks(?:\/(\d+))?$/, blocksPage],
  [/^#\/block\/(\d+|[0-9a-fA-F]{64})$/, blockPage],
  [/^#\/output\/([0-9a-fA-F]{64})$/, outputPage],
  [/^#\/kernel\/([0-9a-fA-F]{64})$/, kernelPage],
  [/^#\/bonds$/, bondsPage],
  [/^#\/privacy$/, privacyPage],
  [/^#\/network$/, networkPage],
  [/^#\/mempool$/, mempoolPage],
  [/^#\/bond\/([0-9a-fA-F]{64})$/, bondPage],
];
async function route() {
  generation++;
  clearTimeout(timer);
  const hash = location.hash || "#/";
  const found = routes.find(([re]) => re.test(hash));
  window.scrollTo(0, 0);
  if (!found) { view.replaceChildren(section("Not found", null, h("div", { class: "empty" }, "No page at " + hash + "."))); return; }
  try { await found[1](hash.match(found[0])); }
  catch (e) { view.replaceChildren(section("Nothing here", null, h("div", { class: "empty" }, e.message))); }
}
document.getElementById("search").addEventListener("submit", async ev => {
  ev.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  try {
    const r = await get("/explorer/search/" + encodeURIComponent(q));
    document.getElementById("q").value = "";
    location.hash = "#/" + r.kind + "/" + r.id;
  } catch (e) { flash(e.message); }
});
window.addEventListener("hashchange", route);
route();
</script>
