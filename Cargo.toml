[package]
name = "midwimble"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Midstate's network and consensus layers carrying Pluribit-style MimbleWimble transactions"

[features]
default = ["node"]
# Everything that needs sockets, a database or an async runtime.
# `cargo test --no-default-features` exercises the pure consensus + MW core.
node = [
    "dep:libp2p", "dep:libp2p-stream", "dep:tokio", "dep:futures", "dep:async-trait",
    "dep:redb", "dep:tracing-subscriber", "dep:clap", "dep:axum",
]
# Browser light clients over /webrtc-direct (pulls in the large webrtc-rs stack).
webrtc = ["node", "dep:libp2p-webrtc"]
# Short PoW chains and an easy genesis target, for tests and local devnets.
fast-mining = []
# midstate's wgpu GPU miner (Vulkan / Metal / DX12 / GL).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:toml"]

[dependencies]
# ── shared core ────────────────────────────────────────────────────────────
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
blake3 = "1"
hex = "0.4"
im = { version = "15", features = ["serde"] }
primitive-types = "0.13"
rayon = "1"
rand = "0.8"
tracing = "0.1"
zeroize = "1"

# ── MimbleWimble (from pluribit) ───────────────────────────────────────────
curve25519-dalek = { version = "4", features = ["rand_core", "digest"] }
bulletproofs = "5"
merlin = "3"
chacha20poly1305 = "0.10"
argon2 = "0.5"
bip39 = "2"
bech32 = "0.11"

# ── node (from midstate) ───────────────────────────────────────────────────
libp2p = { version = "0.56", optional = true, features = [
    "tokio", "tcp", "quic", "noise", "yamux", "request-response", "kad",
    "identify", "relay", "dcutr", "autonat", "macros", "ed25519", "dns",
] }
libp2p-stream = { version = "0.4.0-alpha", optional = true }
libp2p-webrtc = { version = "0.9.0-alpha.1", optional = true, features = ["tokio", "pem"] }
tokio = { version = "1", optional = true, features = ["full"] }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
redb = { version = "2", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "tokio", "http1", "query"] }
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
toml = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "midwimble"
path = "src/bin/main.rs"
required-features = ["node"]

[[test]]
name = "network"
required-features = ["node", "fast-mining"]

[[test]]
name = "merge_mining"
required-features = ["node", "fast-mining"]

[[test]]
name = "pool"
required-features = ["node", "fast-mining"]

[[test]]
name = "quantum_recovery"
required-features = ["node", "fast-mining"]

[[test]]
name = "pruning"
required-features = ["node", "fast-mining"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
